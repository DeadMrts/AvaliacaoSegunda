# Docker Compose Specification (o campo "version" é obsoleto e foi omitido).
services:
  db:
    image: mysql:9.7            # série LTS atual (8.4 é a LTS anterior)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql                            # persistência
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # esquema inicial
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    # Sem "ports": o banco fica acessível apenas dentro da rede do Compose.

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db               # nome do serviço = nome DNS na rede interna
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy   # só inicia a API depois do health check do banco

volumes:
  mysql_data:
